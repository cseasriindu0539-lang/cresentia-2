<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crescentia — Puzzle</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="theme-dark">
  <div class="noise-overlay"></div>

  <main class="game">
    <header class="game-header">
      <h1 class="game-title">Final Sequence</h1>
      <p class="game-subtitle">Enter all 10 characters to unlock victory.</p>
    </header>

    <section class="inputs-grid" aria-label="Answer inputs">
      <!-- 10 single-character inputs -->
      <input maxlength="1" class="char" aria-label="Character 1" />
      <input maxlength="1" class="char" aria-label="Character 2" />
      <input maxlength="1" class="char" aria-label="Character 3" />
      <input maxlength="1" class="char" aria-label="Character 4" />
      <input maxlength="1" class="char" aria-label="Character 5" />
      <input maxlength="1" class="char" aria-label="Character 6" />
      <input maxlength="1" class="char" aria-label="Character 7" />
      <input maxlength="1" class="char" aria-label="Character 8" />
      <input maxlength="1" class="char" aria-label="Character 9" />
      <input maxlength="1" class="char" aria-label="Character 10" />
    </section>

    <div class="controls">
      <button id="btnSubmit" class="btn-primary">Submit</button>
      <button id="btnClear" class="btn-ghost">Clear</button>
    </div>

    <section class="hints">
      <h2>First Puzzle</h2>
      <ol>
        <!-- Replace these with your real event clues -->
        <li>Open the Crescentia file on desktop and complete the task in that file!</li>
      </ol>
      <p class="hint-note">Tip: the game will be tricky don't loose hope so fast</p>
    </section>

    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <script src="assets/js/game.js"></script>
</body>
</html>
